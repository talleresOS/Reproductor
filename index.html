<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamWeb - Música Libre y Legal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-xl font-bold text-cyan-400 flex items-center gap-2">
                🎧 StreamWeb Free
            </h1>
            <div class="w-full sm:w-auto flex gap-2 flex-1 max-w-md">
                <input type="text" id="searchInput" placeholder="Busca artistas, géneros o canciones..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-cyan-400">
                <button onclick="searchMusic()" class="bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-semibold px-4 py-2 rounded-lg text-sm transition">
                    Buscar
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full p-4 flex-1 grid grid-cols-1 md:grid-cols-3 gap-6">
        <section class="md:col-span-2 bg-slate-800/50 border border-slate-700/50 rounded-xl p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-3 text-slate-300">Explorar / Resultados</h2>
            <div id="trackList" class="space-y-2 overflow-y-auto max-h-[50vh] pr-2">
                <p class="text-slate-400 text-sm italic">Escribe algo en el buscador o presiona buscar para cargar pistas de prueba en streaming...</p>
            </div>
        </section>

        <section class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-4 flex flex-col">
            <h2 class="text-lg font-semibold mb-3 text-slate-300">Favoritos ⭐</h2>
            <div id="favoritesList" class="space-y-2 overflow-y-auto max-h-[50vh] text-sm text-slate-400">
                <p class="italic">No hay favoritos guardados aún.</p>
            </div>
        </section>
    </main>

    <footer class="bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3 w-full sm:w-1/3">
                <div class="w-12 h-12 bg-slate-700 rounded-lg flex items-center justify-center text-xl" id="currentCover">🎵</div>
                <div class="overflow-hidden">
                    <p id="currentTitle" class="text-sm font-medium truncate">Ninguna pista seleccionada</p>
                    <p id="currentArtist" class="text-xs text-slate-400 truncate">-</p>
                </div>
            </div>

            <div class="flex flex-col items-center gap-1 w-full sm:w-1/3">
                <div class="flex items-center gap-4">
                    <button onclick="toggleShuffle()" id="shuffleBtn" class="text-slate-400 hover:text-cyan-400 text-sm">🔀</button>
                    <button onclick="playPrev()" class="text-slate-300 hover:text-white text-lg">⏮</button>
                    <button onclick="togglePlay()" id="playPauseBtn" class="bg-cyan-400 text-slate-950 w-10 h-10 rounded-full flex items-center justify-center font-bold hover:bg-cyan-300 transition">▶</button>
                    <button onclick="playNext()" class="text-slate-300 hover:text-white text-lg">⏭</button>
                </div>
                <audio id="audioPlayer" class="w-full hidden"></audio>
            </div>

            <div class="w-full sm:w-1/3 flex justify-end text-xs text-slate-400">
                <span>Streaming en directo (Sin descargas)</span>
            </div>
        </div>
    </footer>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const trackList = document.getElementById('trackList');
        const favoritesList = document.getElementById('favoritesList');

        let tracks = [
            { id: 1, title: "Acoustic Breeze", artist: "Bensound", audio: "https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3", cover: "🎸" },
            { id: 2, title: "Tenderness", artist: "Bensound", audio: "https://www.bensound.com/bensound-music/bensound-tenderness.mp3", cover: "🎹" },
            { id: 3, title: "Creative Minds", artist: "Bensound", audio: "https://www.bensound.com/bensound-music/bensound-creativeminds.mp3", cover: "🚀" }
        ];

        let favorites = [];
        let currentIndex = 0;
        let isPlaying = false;

        function renderTracks() {
            trackList.innerHTML = '';
            tracks.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 hover:bg-slate-700/50 rounded-lg cursor-pointer transition";
                div.innerHTML = `
                    <div class="flex items-center gap-3" onclick="loadTrack(${index})">
                        <span class="text-xl">${track.cover}</span>
                        <div>
                            <p class="text-sm font-medium text-slate-200">${track.title}</p>
                            <p class="text-xs text-slate-400">${track.artist}</p>
                        </div>
                    </div>
                    <button onclick="toggleFavorite(${track.id})" class="text-sm text-slate-400 hover:text-yellow-400">⭐</button>
                `;
                trackList.appendChild(div);
            });
        }

        function loadTrack(index) {
            currentIndex = index;
            const track = tracks[index];
            audio.src = track.audio;
            currentTitle.textContent = track.title;
            currentArtist.textContent = track.artist;
            audio.play();
            isPlaying = true;
            playPauseBtn.textContent = "⏸";
        }

        function togglePlay() {
            if (!audio.src && tracks.length > 0) {
                loadTrack(0);
                return;
            }
            if (isPlaying) {
                audio.pause();
                playPauseBtn.textContent = "▶";
            } else {
                audio.play();
                playPauseBtn.textContent = "⏸";
            }
            isPlaying = !isPlaying;
        }

        function playNext() {
            currentIndex = (currentIndex + 1) % tracks.length;
            loadTrack(currentIndex);
        }

        function playPrev() {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentIndex);
        }

        function toggleFavorite(id) {
            const track = tracks.find(t => t.id === id);
            if (!favorites.some(f => f.id === id)) {
                favorites.push(track);
            } else {
                favorites = favorites.filter(f => f.id !== id);
            }
            renderFavorites();
        }

        function renderFavorites() {
            if (favorites.length === 0) {
                favoritesList.innerHTML = '<p class="italic text-slate-400">No hay favoritos guardados aún.</p>';
                return;
            }
            favoritesList.innerHTML = '';
            favorites.forEach(fav => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 bg-slate-900/40 rounded-lg";
                div.innerHTML = `
                    <span class="text-xs text-slate-200 truncate">${fav.title} - ${fav.artist}</span>
                `;
                favoritesList.appendChild(div);
            });
        }

        function searchMusic() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tracks.filter(t => t.title.toLowerCase().includes(query) || t.artist.toLowerCase().includes(query));
            trackList.innerHTML = '';
            filtered.forEach((track, index) => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 hover:bg-slate-700/50 rounded-lg cursor-pointer transition";
                div.innerHTML = `
                    <div class="flex items-center gap-3" onclick="loadTrack(${tracks.indexOf(track)})">
                        <span class="text-xl">${track.cover}</span>
                        <div>
                            <p class="text-sm font-medium text-slate-200">${track.title}</p>
                            <p class="text-xs text-slate-400">${track.artist}</p>
                        </div>
                    </div>
                `;
                trackList.appendChild(div);
            });
        }

        renderTracks();
    </script>
</body>
</html>
